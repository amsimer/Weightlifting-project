<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Power Cable interface demos</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b1520;
      color: #f5f8fb;
    }

    body {
      margin: 0;
      padding: 40px 20px 64px;
    }

    main {
      width: min(1080px, 100%);
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 8px;
      font-size: clamp(2rem, 5vw, 3.5rem);
    }

    .intro {
      margin: 0 0 32px;
      color: #b9c7d5;
    }

    .demo {
      margin-top: 24px;
      padding: 24px;
      border: 1px solid #34495c;
      border-radius: 18px;
      background: #142230;
      box-shadow: 0 16px 40px rgb(0 0 0 / 20%);
    }

    h2 {
      margin-top: 0;
    }

    video {
      display: block;
      width: 100%;
      max-height: 75vh;
      border-radius: 12px;
      background: #05090d;
    }

    a {
      color: #39adff;
    }

    .fallback {
      margin-bottom: 0;
      color: #b9c7d5;
    }
  </style>
</head>
<body>
  <main>
    <h1>Power Cable interface demos</h1>
    <p class="intro">Screen recordings of the two wireless interfaces during training.</p>

    <section class="demo" id="ios">
      <h2>iOS application</h2>
      <video controls preload="metadata" playsinline>
        <source src="Demos/ios-app-recording.mp4" type="video/mp4">
      </video>
      <p class="fallback"><a href="Demos/ios-app-recording.mp4">Open or download the iOS demo</a></p>
    </section>

    <section class="demo" id="wifi">
      <h2>Wi-Fi dashboard</h2>
      <video controls preload="metadata" playsinline>
        <source src="Demos/web-dashboard-recording.mov" type="video/quicktime">
      </video>
      <p class="fallback"><a href="Demos/web-dashboard-recording.mov">Open or download the Wi-Fi dashboard demo</a></p>
    </section>
  </main>
</body>
</html>
