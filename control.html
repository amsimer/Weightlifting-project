<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ODrive Load Console</title>
<style>
  :root{
    --bg:#14171a; --panel:#1c2024; --line:#2c3136; --amber:#ff8a3d; --amber-dim:#7a4a26;
    --green:#6fcf97; --red:#e5636e; --yellow:#e8c25a; --text:#e7e5e0; --text-dim:#8a9099;
    --mono:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;
    --sans:'Inter',-apple-system,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:radial-gradient(circle at 20% -10%,#1e232a 0%,var(--bg) 55%);
    color:var(--text); font-family:var(--sans);
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .wrap{width:100%; max-width:640px;}
  .console{background:var(--panel); border:1px solid var(--line); border-radius:4px; overflow:hidden; box-shadow:0 30px 60px -20px rgba(0,0,0,.6);}
  .topbar{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px 20px; border-bottom:1px solid var(--line);}
  .topbar h1{font-size:14px; font-weight:600; letter-spacing:.02em; margin:0;}
  .topbar .sub{font-family:var(--mono); font-size:11px; color:var(--text-dim); margin-top:2px;}
  .right{display:flex; align-items:center; gap:12px;}
  .status{display:flex; align-items:center; gap:8px; font-family:var(--mono); font-size:12px;}
  .dot{width:8px; height:8px; border-radius:50%; background:var(--text-dim);}
  .dot.live{background:var(--green); box-shadow:0 0 10px 1px rgba(111,207,151,.6);}
  .dot.wait{background:var(--yellow); box-shadow:0 0 10px 1px rgba(232,194,90,.5);}
  .dot.fault{background:var(--red); box-shadow:0 0 10px 1px rgba(229,99,110,.6);}
  button.connect{font-family:var(--mono); font-size:12px; background:transparent; color:var(--text); border:1px solid var(--line); border-radius:3px; padding:7px 12px; cursor:pointer;}
  button.connect:hover{border-color:var(--amber); color:var(--amber);}
  .readout{display:grid; grid-template-columns:1fr 1fr; border-bottom:1px solid var(--line);}
  .readout .cell{padding:22px 20px 18px;}
  .readout .cell + .cell{border-left:1px solid var(--line);}
  .readout label{display:block; font-size:11px; color:var(--text-dim); letter-spacing:.02em; margin-bottom:10px;}
  .readout .value{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:52px; line-height:1;}
  .readout .value.target{color:var(--amber);}
  .readout .unit{font-size:16px; color:var(--text-dim); margin-left:6px;}
  .adjust{padding:18px 20px; border-bottom:1px solid var(--line);}
  .adjust label{display:block; font-size:11px; color:var(--text-dim); margin-bottom:10px;}
  .grid-btn{display:grid; grid-template-columns:repeat(5,1fr); gap:6px;}
  .grid-btn button{font-family:var(--mono); font-size:13px; padding:11px 0; background:#22262b; color:var(--text); border:1px solid var(--line); border-radius:3px; cursor:pointer;}
  .grid-btn button:hover{border-color:var(--amber);}
  .grid-btn button:active{background:var(--amber-dim);}
  .grid-btn button.neg{color:#e0a98a;}
  .controls{display:grid; grid-template-columns:1fr 1fr 1fr; gap:1px; background:var(--line);}
  .controls button{font-family:var(--sans); font-size:13px; font-weight:600; padding:16px 0; background:var(--panel); color:var(--text); border:none; cursor:pointer;}
  .controls button:hover{background:#242830;}
  .controls button:disabled{opacity:.45; cursor:not-allowed;}
  .controls button#armBtn.armed{color:var(--green);}
  .controls button#clearBtn{color:var(--red);}
  .log{font-family:var(--mono); font-size:11px; color:var(--text-dim); padding:10px 20px; border-top:1px solid var(--line); white-space:pre-wrap; min-height:36px;}
  .setup{margin-top:14px; font-family:var(--mono); font-size:11px; color:var(--text-dim); line-height:1.6;}
</style>
</head>
<body>
<div class="wrap">
  <div class="console">
    <div class="topbar">
      <div>
        <h1>ODrive Load Console</h1>
        <div class="sub" id="axisInfo">axis1 · --</div>
      </div>
      <div class="right">
        <button class="connect" id="connectBtn">Connect</button>
        <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">disconnected</span></div>
      </div>
    </div>

    <div class="readout">
      <div class="cell"><label>set weight</label><span class="value target" id="setWeight">--<span class="unit">kg</span></span></div>
      <div class="cell"><label>current weight</label><span class="value" id="currentWeight">--<span class="unit">kg</span></span></div>
    </div>

    <div class="adjust">
      <label>adjust set weight (kg)</label>
      <div class="grid-btn">
        <button class="neg" data-kg="-10">-10</button>
        <button class="neg" data-kg="-5">-5</button>
        <button class="neg" data-kg="-2.5">-2.5</button>
        <button class="neg" data-kg="-1">-1</button>
        <button class="neg" data-kg="-0.5">-0.5</button>
        <button data-kg="0.5">+0.5</button>
        <button data-kg="1">+1</button>
        <button data-kg="2.5">+2.5</button>
        <button data-kg="5">+5</button>
        <button data-kg="10">+10</button>
      </div>
    </div>

    <div class="controls">
      <button id="calBtn">Calibrate</button>
      <button id="armBtn">On / Off</button>
      <button id="clearBtn">Clear errors</button>
    </div>
    <div class="log" id="log"></div>
  </div>
  <div class="setup">
    works in any order: the page reconnects by itself when the adapter is plugged in or the ODrive is powered ·
    first time only: press Connect and pick the adapter · UART GPIO1/GPIO2, 115200 baud · Chrome/Edge only
  </div>
</div>

<script>
const kgToCurrent = 1.0 / 1.8;
const STATE_NAMES = {0:'UNDEFINED',1:'IDLE',2:'STARTUP',3:'FULL CALIBRATION',4:'MOTOR CALIBRATION',
  5:'SENSORLESS',6:'ENCODER INDEX SEARCH',7:'ENCODER OFFSET CAL',8:'CLOSED LOOP',9:'LOCKIN SPIN',10:'ENCODER DIR FIND'};
const IDLE = 1, CALIBRATE = 3, CLOSED_LOOP = 8;

const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const unit = '<span class="unit">kg</span>';
const showKg = (el, v) => { el.innerHTML = (v == null ? '--' : v.toFixed(2)) + unit; };
const log = (m) => { $('log').textContent = m; };

// ---------- connection state ----------
let port = null, reader = null, writer = null;
let portOpen = false, online = false, failCount = 0;
let wantConnection = true;       // false after the user presses Disconnect
let session = 0;                 // bumps on every (re)connect so old loops stop
let lineBuffer = '', waiter = null, queue = Promise.resolve();
let setKg = null, axisState = null, axisError = 0, calibrating = false;

function render(){
  let dot = '', text = 'disconnected';
  if(portOpen && !online){ dot = 'wait'; text = 'port open · waiting for ODrive'; }
  else if(portOpen && axisError){ dot = 'fault'; text = 'axis error'; }
  else if(portOpen){ dot = 'live'; text = 'connected'; }
  $('statusDot').className = 'dot ' + dot;
  $('statusText').textContent = text;
  $('connectBtn').textContent = portOpen || (wantConnection && port) ? 'Disconnect' : 'Connect';
  const known = online && axisState != null;
  $('axisInfo').textContent = 'axis1 · ' + (known ? (STATE_NAMES[axisState] || 'STATE ' + axisState) : '--')
    + (online && axisError ? ' · error 0x' + axisError.toString(16) : '');
  $('armBtn').classList.toggle('armed', axisState === CLOSED_LOOP);
  $('calBtn').disabled = calibrating;
  $('armBtn').disabled = calibrating;
  if(!online){ showKg($('currentWeight'), null); if(!portOpen) showKg($('setWeight'), null); }
}

async function openPort(p){
  if(portOpen) return;
  const my = ++session;
  try{
    await p.open({ baudRate: 115200 });
  }catch(err){
    log('could not open port: ' + err.message + ' (will retry)');
    return false;
  }
  port = p; portOpen = true; online = false; failCount = 0; lineBuffer = ''; waiter = null;
  queue = Promise.resolve();
  writer = port.writable.getWriter();
  reader = port.readable.getReader();
  readLoop(my);
  pollLoop(my);
  log('port open, waiting for ODrive…');
  render();
  return true;
}

async function closePort(){
  session++;                      // stops loops
  portOpen = false; online = false; axisState = null; axisError = 0;
  if(waiter){ waiter(null); waiter = null; }
  try{ await reader?.cancel(); }catch(e){}
  try{ reader?.releaseLock(); }catch(e){}
  try{ writer?.releaseLock(); }catch(e){}
  try{ await port?.close(); }catch(e){}
  reader = writer = null;
  render();
}

async function readLoop(my){
  const dec = new TextDecoder();
  try{
    while(my === session){
      const { value, done } = await reader.read();
      if(done) break;
      lineBuffer += dec.decode(value, { stream: true });
      let i;
      while((i = lineBuffer.indexOf('\n')) >= 0){
        const line = lineBuffer.slice(0, i).replace('\r','').trim();
        lineBuffer = lineBuffer.slice(i + 1);
        if(line && waiter){ const w = waiter; waiter = null; w(line); }
      }
    }
  }catch(err){ /* unplugged or cancelled */ }
  if(my === session){          // lost unexpectedly
    await closePort();
    log('adapter disconnected, waiting for it to come back…');
  }
}

// ---------- commands (strictly one at a time) ----------
function enqueue(fn){
  const p = queue.then(fn, fn);
  queue = p.catch(() => {});
  return p;
}
async function rawWrite(cmd){
  await writer.write(new TextEncoder().encode(cmd + '\n'));
}
function send(cmd){                 // write, no reply expected
  if(!portOpen) return Promise.resolve();
  return enqueue(() => rawWrite(cmd)).catch(() => {});
}
function query(cmd, timeout = 350){ // read, wait for the reply line
  if(!portOpen) return Promise.resolve(null);
  return enqueue(async () => {
    const reply = new Promise(res => {
      waiter = res;
      setTimeout(() => { if(waiter === res){ waiter = null; res(null); } }, timeout);
    });
    await rawWrite(cmd);
    return reply;
  }).catch(() => null);
}
async function queryNum(cmd){
  const r = await query(cmd);
  const n = r == null ? NaN : parseFloat(r);
  return isNaN(n) ? null : n;
}

// ---------- polling ----------
async function pollLoop(my){
  await rawWrite('').catch(() => {});      // flush any boot noise
  let n = 0;
  while(my === session){
    const iq = await queryNum('r axis1.motor.current_control.Iq_measured');
    if(my !== session) return;
    if(iq == null){
      if(++failCount >= 3 && online){ online = false; axisState = null; log('ODrive stopped responding, waiting…'); render(); }
      await sleep(300);
      continue;
    }
    failCount = 0;
    if(!online){ online = true; log('ODrive online'); }
    showKg($('currentWeight'), iq / kgToCurrent);

    const lim = await queryNum('r axis1.motor.config.current_lim');
    if(lim != null){ setKg = lim / kgToCurrent; showKg($('setWeight'), setKg); }
    const st = await queryNum('r axis1.current_state');
    if(st != null) axisState = st;
    if(n++ % 3 === 0){
      const err = await queryNum('r axis1.error');
      if(err != null) axisError = err;
    }
    render();
    await sleep(60);
  }
}

// ---------- actions ----------
function setForceKg(kg){
  if(!online){ log('ODrive not connected yet'); return; }
  setKg = Math.max(0, kg);
  send(`w axis1.motor.config.current_lim ${(setKg * kgToCurrent).toFixed(4)}`);
  showKg($('setWeight'), setKg);
}
document.querySelectorAll('.grid-btn button').forEach(b =>
  b.addEventListener('click', () => setForceKg((setKg ?? 0) + parseFloat(b.dataset.kg))));

async function clearErrors(){
  await send('sc');
  await sleep(150);
  const e = await queryNum('r axis1.error');
  if(e != null) axisError = e;
  render();
}

$('clearBtn').addEventListener('click', async () => {
  if(!online){ log('ODrive not connected yet'); return; }
  await clearErrors();
  log(axisError ? 'errors still present: 0x' + axisError.toString(16) : 'errors cleared');
});

$('armBtn').addEventListener('click', async () => {
  if(!online){ log('ODrive not connected yet'); return; }
  if(axisState === CLOSED_LOOP){
    await send(`w axis1.requested_state ${IDLE}`);
    log('idle requested');
    return;
  }
  if(axisError) await clearErrors();
  await send(`w axis1.requested_state ${CLOSED_LOOP}`);
  await sleep(500);
  log(axisState === CLOSED_LOOP ? 'closed loop active'
      : axisError ? 'could not enter closed loop, error 0x' + axisError.toString(16) + ' (calibrate first?)'
      : 'closed loop requested');
});

$('calBtn').addEventListener('click', async () => {
  if(!online){ log('ODrive not connected yet'); return; }
  calibrating = true; render();
  try{
    log('preparing: idle + clearing errors…');
    await send(`w axis1.requested_state ${IDLE}`);
    await sleep(400);
    await clearErrors();
    await send(`w axis1.requested_state ${CALIBRATE}`);
    log('calibrating, keep clear of the handle…');
    const t0 = Date.now();
    await sleep(1500);
    while(Date.now() - t0 < 40000 && online && axisState !== IDLE) await sleep(250);
    await sleep(300);
    const e = await queryNum('r axis1.error');
    if(e != null) axisError = e;
    if(!online) log('lost contact with the ODrive during calibration');
    else if(axisError) log('calibration failed, error 0x' + axisError.toString(16) + ' (press Clear errors and try again)');
    else log('calibration complete');
  }finally{
    calibrating = false; render();
  }
});

$('connectBtn').addEventListener('click', async () => {
  if(portOpen || wantConnection && port){      // Disconnect
    wantConnection = false;
    await closePort();
    log('disconnected');
    render();
    return;
  }
  if(!('serial' in navigator)){ log('Web Serial not supported, use Chrome or Edge.'); return; }
  try{
    const p = await navigator.serial.requestPort();
    wantConnection = true;
    port = p;
    await openPort(p);
  }catch(err){
    log('connect cancelled: ' + err.message);
  }
});

// ---------- automatic (re)connection ----------
async function autoConnect(){
  if(!wantConnection || portOpen || !('serial' in navigator)) return;
  const ports = await navigator.serial.getPorts();
  if(ports.length) await openPort(ports[ports.length - 1]);
}
if('serial' in navigator){
  navigator.serial.addEventListener('connect', () => setTimeout(autoConnect, 500));
  navigator.serial.addEventListener('disconnect', async () => {
    if(portOpen){ await closePort(); log('adapter unplugged, waiting for it to come back…'); }
  });
  setInterval(autoConnect, 2000);   // safety net in case an event is missed
  autoConnect();
}else{
  log('Web Serial not supported, use Chrome or Edge.');
}
render();
</script>
</body>
</html>
